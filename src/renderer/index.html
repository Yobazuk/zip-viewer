<!DOCTYPE html>
<html>
<head>
    <title>ZIP Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="titlebar">
        <div class="titlebar-drag-region">ZIP Viewer</div>
        <div class="window-controls">
            <button class="window-control" id="minimize-button">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect fill="currentColor" width="10" height="1" x="1" y="6"></rect>
                </svg>
            </button>
            <button class="window-control" id="maximize-button">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect fill="currentColor" width="9" height="9" x="1.5" y="1.5" style="fill:none;stroke:currentColor;stroke-width:1.2"></rect>
                </svg>
            </button>
            <button class="window-control close-button" id="close-button">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/>
                    <line x1="2" y1="10" x2="10" y2="2" stroke="currentColor" stroke-width="1.2"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="app-container">
        <div class="sidebar">
            <div class="file-info">
                <div id="current-file"></div>
            </div>
            <div class="file-tree" id="file-tree"></div>
        </div>
        <div class="main-content">
            <div class="drop-zone" id="drop-zone">
                <div class="drop-message">
                    <h3>Drop a ZIP file here</h3>
                    <p>or click to select a file</p>
                </div>
            </div>
            <div class="metadata-panel" id="metadata-panel">
                <h3>File Details</h3>
                <div class="metadata-content" id="metadata-content"></div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
